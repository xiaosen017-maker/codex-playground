<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chiikawa Survival Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-shell">
    <div id="start-screen" class="overlay active">
      <div class="panel">
        <h1>🌟 Chiikawa 生存竞技场</h1>
        <p>可爱外表，硬核生存！和 Chiikawa 一起坚持到最后。</p>
        <ul>
          <li>WASD / 方向键移动，空格主动挥击</li>
          <li>手机端可用虚拟摇杆与攻击按钮</li>
          <li>升级时从 3 个强化中选择 1 个</li>
        </ul>
        <button id="start-btn">开始冒险</button>
      </div>
    </div>

    <div id="game-over-screen" class="overlay">
      <div class="panel">
        <h2>💥 冒险结束</h2>
        <p id="final-stats"></p>
        <button id="restart-btn">再来一局</button>
      </div>
    </div>

    <div id="levelup-screen" class="overlay">
      <div class="panel">
        <h2>⬆️ 选择强化</h2>
        <div id="upgrade-options"></div>
      </div>
    </div>

    <div id="hud">
      <div class="top-row">
        <div class="hp-wrap">
          <span>HP</span>
          <div class="bar"><div id="hp-bar"></div></div>
          <span id="hp-text"></span>
        </div>
        <div class="meta">
          <span>Lv.<b id="level">1</b></span>
          <span>击败 <b id="kills">0</b></span>
          <span>时间 <b id="time">0.0s</b></span>
          <button id="pause-btn">暂停</button>
        </div>
      </div>
      <div class="xp-wrap">
        <div class="bar"><div id="xp-bar"></div></div>
        <span id="xp-text">0 / 20</span>
      </div>
    </div>

    <canvas id="game-canvas" width="960" height="540"></canvas>

    <div id="mobile-controls">
      <div id="joystick-zone">
        <div id="joystick-knob"></div>
      </div>
      <button id="attack-btn">⚔️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
